<div class="login-bg">
  <div class="login-card">
    <div class="login-left">
      <div class="brand-icon">AT</div>
      <span class="login-brand">ANSERTECH</span>
      <p class="login-tagline">Portal interno de gestión y cotizaciones</p>
    </div>

    <div class="login-right">
      <h2 class="login-title">Acceso al sistema</h2>
      <p class="login-subtitle">Ingresa tus credenciales</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label class="form-label">EMAIL</label>
          <input
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            placeholder="usuario@empresa.pe"
            required>
        </div>

        <div class="form-group">
          <label class="form-label">CONTRASEÑA</label>
          <input
            type="password"
            class="form-control"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            required>
        </div>

        <button type="submit" class="btn-login">Ingresar</button>
      </form>
    </div>
  </div>
</div>
